# The Windows app's installer, built on Windows for every push that touches it (or the dashboard it shows); the .exe is
# the run's artifact. Publishing it as a release (for the app's own updates) is a separate, manual step.
name: Windows app

on:
  push:
    branches: [staging, main]
    paths: ['windows/**', 'app/Resources/web/**', '.github/workflows/windows.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci
      - name: Signing key for the API
        run: node scripts/clientkey.js
        env:
          ATALAY_CLIENT_KEY: ${{ secrets.ATALAY_CLIENT_KEY }}
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: atalay-terminal-windows
          path: windows/dist/*.exe
          if-no-files-found: error
